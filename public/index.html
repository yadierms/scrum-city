<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCRUM CITY · tuneando el equipo SOLTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik:wght@400;600;800&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110724; --panel:#1C0F3A; --panel2:#241351; --line:#3A2763;
  --ink:#F5EEFF; --ink2:#B7A5D6;
  --pink:#FF2E88; --orange:#FF8A3D; --gold:#FFC857; --purple:#C26BFF; --violet:#7A3BFF;
  --cyan:#2EE6D6; --red:#FF4D6A; --green:#7CFFB2;
  --title:Anton,"Arial Black",Impact,sans-serif;
  --script:Yellowtail,"Segoe Script",cursive;
  --body:Rubik,"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.4;
  overflow:hidden;
  background-image:radial-gradient(1200px 500px at 50% -120px,#3D1466 0%,transparent 70%);
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------------- estructura ---------------- */
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
#stage{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:16px;padding:12px 18px;min-height:0}
#bay,#panel{min-height:0;min-width:0}
#panel{overflow:auto;padding-right:6px;display:grid;gap:12px;align-content:start}
#bay{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;min-height:0}
/* modo lectura: la pantalla se ve igual, pero no se toca */
body.lectura #bMenu{display:none}
body.lectura #panel button,body.lectura #panel input,body.lectura #panel textarea{opacity:.38;pointer-events:none}
body.lectura #bench .big{opacity:.4}
@media (max-width:1100px){#stage{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}#bay{display:none}}

/* ---------------- HUD ---------------- */
#hud{display:flex;align-items:center;gap:14px;padding:10px 18px 6px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(61,20,102,.55),transparent)}
.brand{display:grid;line-height:1}
.brand .t{font-family:var(--title);font-size:27px;letter-spacing:.5px;
  background:linear-gradient(92deg,var(--gold),var(--orange) 40%,var(--pink) 72%,var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand .s{font-family:var(--script);font-size:19px;color:var(--pink);text-shadow:0 0 12px rgba(255,46,136,.75);margin-top:2px}

/* carretera de rondas */
#track{flex:1;display:flex;align-items:center;gap:0;min-width:0}
.stop{flex:1;display:grid;justify-items:center;gap:5px;position:relative;min-width:0}
.stop::before{content:"";position:absolute;top:9px;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 18px)}
.stop i{width:20px;height:20px;border-radius:50%;background:var(--panel);border:2px solid var(--line);position:relative;z-index:1}
.stop span{font-size:11px;letter-spacing:.7px;color:var(--ink2);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stop.done i{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.stop.now i{background:var(--pink);border-color:#fff;box-shadow:0 0 16px var(--pink);transform:scale(1.35)}
.stop.now span{color:#fff;font-weight:800}

.hudbtns{display:flex;align-items:center;gap:8px}
.ico{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;display:grid;place-items:center}
.ico:hover{border-color:var(--purple)}
.ico.on{background:var(--violet);border-color:var(--purple)}
#clock{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--green);text-shadow:0 0 14px rgba(124,255,178,.6);min-width:104px;text-align:center}
#clock.low{color:var(--gold);text-shadow:0 0 14px rgba(255,200,87,.8)}
#clock.zero{color:var(--red);text-shadow:0 0 14px rgba(255,77,106,.8)}
.count{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 11px;text-align:center;line-height:1.15}
.count b{display:block;font-family:var(--title);font-size:22px;color:var(--cyan)}
.count span{font-size:10px;letter-spacing:.8px;color:var(--ink2);text-transform:uppercase}

/* ---------------- banca inferior ---------------- */
#bench{display:flex;align-items:center;gap:14px;padding:9px 18px;border-top:1px solid var(--line);background:rgba(28,15,58,.6)}
#bolts{display:flex;gap:7px}
.bolt{width:26px;height:26px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink2)}
.bolt.on{border:2px solid var(--cyan);background:rgba(46,230,214,.16);color:var(--cyan);box-shadow:0 0 10px rgba(46,230,214,.5)}
#hint{color:var(--ink2);font-size:15px;flex:1;min-width:0}
.big{font-family:var(--title);letter-spacing:.5px;border:0;border-radius:12px;padding:13px 22px;font-size:20px;cursor:pointer;
  background:linear-gradient(92deg,var(--pink),var(--orange));color:#2A0616;box-shadow:0 0 22px rgba(255,46,136,.45)}
.big:hover{filter:brightness(1.1)}
.big.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.big[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.big.pulse{animation:pulse 1.5s ease-in-out infinite}

/* ---------------- tarjetas del panel ---------------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card h2{font-family:var(--title);font-size:25px;margin:0 0 4px;letter-spacing:.4px;
  background:linear-gradient(92deg,var(--gold),var(--orange) 45%,var(--pink) 78%,var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.card h3{font-family:var(--title);font-size:19px;margin:0 0 6px;color:var(--ink);letter-spacing:.4px}
.card p{margin:0 0 6px;color:var(--ink2);font-size:16px}
.tag{display:inline-block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);
  border:1px solid var(--gold);border-radius:999px;padding:2px 9px;margin-bottom:6px}
.tag.c{color:var(--cyan);border-color:var(--cyan)}
.tag.r{color:var(--red);border-color:var(--red)}

/* barras de votos */
.bars{display:grid;gap:7px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.bar{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:11px;overflow:hidden;min-height:46px;display:flex;align-items:center}
.bar .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(92deg,rgba(122,59,255,.85),rgba(255,46,136,.8));transition:width .5s cubic-bezier(.2,.9,.2,1)}
.bar.lead .fill{background:linear-gradient(92deg,var(--violet),var(--pink) 60%,var(--orange))}
.bar .lbl{position:relative;padding:7px 12px;display:grid;gap:1px}
.bar .lbl b{font-size:19px;font-weight:800}
.bar .lbl small{color:#E7DBFF;font-size:13px}
.bar .n{position:relative;margin-left:auto;padding-right:12px;font-family:var(--title);font-size:24px}
.bar.lead .n{color:var(--gold)}
.pm{display:grid;gap:3px}
.pm button{width:30px;height:21px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:13px;line-height:1;padding:0}
.pm button:hover{border-color:var(--purple)}

/* reglas del taller */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rule{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--pink);border-radius:11px;padding:9px 11px;font-size:16px;font-weight:600}
.rule i{font-family:var(--title);color:var(--gold);margin-right:7px;font-style:normal}

/* QR */
.qrwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrwrap.grande{gap:22px}
.qr{background:#fff;padding:12px;border-radius:14px;width:168px;height:168px;display:grid;place-items:center;flex:none;
  box-shadow:0 0 0 4px rgba(255,255,255,.16),0 10px 30px rgba(0,0,0,.45)}
.qr svg{width:100%;height:100%;display:block}
.qrwrap .u{font-family:var(--mono);font-size:15px;color:var(--cyan);word-break:break-all}
.qrwrap.grande .u{font-size:19px;font-weight:700}

/* ideas del taller */
.bay{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.bay.ok{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(46,230,214,.35) inset}
.bay>header{display:flex;align-items:center;gap:9px}
.bay>header .nm{font-family:var(--title);font-size:21px;letter-spacing:.4px}
.bay>header .mn{color:var(--ink2);font-size:14px}
.idea{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;background:var(--panel2);
  border:1px solid var(--line);border-radius:11px;padding:8px 10px;font-size:16px}
.idea.win{border-color:var(--cyan);background:rgba(46,230,214,.1)}
.idea.lead{border-color:var(--gold)}
.idea .mas{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-top:2px}
.idea .favs{font-family:var(--title);font-size:17px;color:var(--gold);min-width:34px;text-align:center}
.idea .acts{display:flex;gap:5px}
.idea .acts button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 9px;font-size:13px;cursor:pointer;white-space:nowrap}
.idea .acts button.go{border-color:var(--cyan);color:var(--cyan)}
.idea .acts button:hover{border-color:var(--purple)}
.empty{color:var(--ink2);font-size:15px;font-style:italic;padding:6px 2px}

/* campos de texto */
.ot{display:grid;gap:7px}
.ot .f{display:grid;grid-template-columns:118px 1fr;gap:9px;align-items:center}
.ot label{font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2)}
.ot input{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;font-size:17px;width:100%}
.ot input:focus{border-color:var(--pink);outline:none}
.ot .done{color:var(--cyan)}

/* notas del buzón */
.notes{display:flex;flex-wrap:wrap;gap:9px}
.note{background:linear-gradient(160deg,#FFE9A8,#FFC857);color:#3A1D00;border-radius:11px;padding:10px 12px;
  font-size:16px;font-weight:600;max-width:320px;position:relative;box-shadow:0 7px 16px rgba(0,0,0,.35);transform:rotate(-1deg)}
.note:nth-child(even){transform:rotate(1.2deg);background:linear-gradient(160deg,#FFD2E6,#FF8FC0)}
.note button{position:absolute;top:-8px;right:-8px;width:23px;height:23px;border-radius:50%;border:0;background:#2A0616;color:#fff;cursor:pointer;font-size:13px;line-height:1;padding:0}
.anim-in{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.quien{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--cyan);
  color:var(--cyan);border-radius:999px;padding:6px 12px;font-size:16px;font-weight:700}
.quien button{border:0;background:none;color:var(--ink2);cursor:pointer;font-size:13px;padding:0;line-height:1}
.quien button:hover{color:var(--red)}

/* resumen final */
.sum{display:grid;gap:9px}
.sum .line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.sum .line b{font-family:var(--title);color:var(--gold);font-size:17px;letter-spacing:.4px}
.road3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.road3 div{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px;text-align:center}
.road3 b{display:block;font-family:var(--title);font-size:21px;color:var(--cyan)}
.road3 span{font-size:13px;color:var(--ink2)}

/* placa del vehículo */
.placa{display:flex;align-items:center;gap:12px;justify-content:center}
.placa .box{background:linear-gradient(180deg,#F7F2FC,#D9C9F2);color:#1A0B33;border-radius:9px;padding:5px 15px;
  font-family:var(--title);font-size:27px;letter-spacing:2px;border:3px solid #fff;box-shadow:0 0 22px rgba(255,46,136,.5)}
.placa .q{font-family:var(--title);font-size:21px;color:var(--ink2);letter-spacing:1px}
.placa .mini{width:84px;height:48px;flex:none}
.placa .mini svg.sil{width:100%;height:100%}
.placa .mini svg.sil path,.placa .mini svg.sil circle,.placa .mini svg.sil line,.placa .mini svg.sil rect{
  stroke:var(--cyan);stroke-width:8;filter:drop-shadow(0 0 7px rgba(46,230,214,.85))}
#bayfoot{text-align:center;color:var(--ink2);font-size:14px;min-height:20px}
.sinpieza{margin-top:10px;color:var(--gold);font-size:16px;line-height:1.45;
  border-left:3px solid var(--gold);padding-left:11px}

/* ---------------- el vehículo ---------------- */
#carbox{display:grid;place-items:center;min-height:0;position:relative}
svg.car,svg.sil{width:100%;height:100%;max-height:100%;display:block}
svg.car .chassis{fill:rgba(17,7,36,.85);stroke:var(--purple);stroke-width:4}
svg.car .frame{fill:none;stroke:var(--purple);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
svg.car .trim{fill:none;stroke:var(--purple);stroke-width:2.5;opacity:.55}
svg.car .pc .f{fill:rgba(46,230,214,.22);stroke:var(--cyan);stroke-width:3;transition:fill .4s,stroke .4s,opacity .4s}
svg.car .pc .s{fill:none;stroke:var(--cyan);stroke-width:5;transition:stroke .4s,opacity .4s}
svg.car .pc .dt{fill:none;stroke:var(--ink);stroke-width:2.5;opacity:.8}
svg.car .pc{transform-box:fill-box;transform-origin:center}

svg.car .pc.st-ghost .f{fill:none;stroke:var(--line);stroke-width:2.5;stroke-dasharray:8 7}
svg.car .pc.st-ghost .s{stroke:var(--line);stroke-dasharray:8 7;stroke-width:3.5}
svg.car .pc.st-ghost .dt{opacity:.25}
svg.car .pc.st-meh .f{fill:rgba(255,200,87,.25);stroke:var(--gold)}
svg.car .pc.st-meh .s{stroke:var(--gold)}
svg.car .pc.st-fix .f{fill:rgba(255,77,106,.3);stroke:var(--red)}
svg.car .pc.st-fix .s{stroke:var(--red)}
svg.car .pc.st-fix{animation:shake 2.2s ease-in-out infinite}
svg.car .pc.st-hole{opacity:.13}
svg.car .pc.st-fixed .f{fill:rgba(46,230,214,.35);stroke:var(--cyan)}
svg.car .pc.st-fixed{filter:drop-shadow(0 0 9px rgba(46,230,214,.9))}
svg.car .pc.st-bolted{filter:drop-shadow(0 0 14px rgba(124,255,178,.95))}
svg.car .pc.st-bolted .f{fill:rgba(124,255,178,.3);stroke:var(--green)}
svg.car .pc.st-bolted .s{stroke:var(--green)}
svg.car .pc.pop{animation:pop .55s cubic-bezier(.2,1.5,.4,1)}

svg.car .lbl rect{fill:rgba(17,7,36,.88);stroke:var(--line);stroke-width:1.5}
svg.car .lbl text{font:800 14px var(--body);fill:var(--ink)}
svg.car .lbl.st-fix rect{fill:var(--red);stroke:var(--red)}
svg.car .lbl.st-fix text{fill:#2A0616}
svg.car .lbl.st-meh rect{stroke:var(--gold)}
svg.car .lbl.st-meh text{fill:var(--gold)}
svg.car .lbl.st-fixed rect,svg.car .lbl.st-bolted rect{stroke:var(--cyan)}
svg.car .lbl.st-fixed text,svg.car .lbl.st-bolted text{fill:var(--cyan)}
svg.car .lbl.st-ghost text{fill:var(--ink2)}
svg.car .lbl.st-hole rect{stroke:var(--red);stroke-dasharray:5 5}
svg.car .lbl.st-hole text{fill:var(--red)}
svg.car .road{stroke:var(--violet);stroke-width:4;stroke-dasharray:26 18;opacity:.75}
svg.car .hole{fill:none;stroke:var(--red);stroke-width:3;stroke-dasharray:6 7;opacity:.9}
svg.car .smoke{fill:#B7A5D6;opacity:0}
svg.car .lights{opacity:0;transition:opacity .4s}
svg.car.on .lights{opacity:1}
svg.car.go .whole{animation:lurch 1.5s cubic-bezier(.3,0,.2,1) 0s 1,idle 1.1s ease-in-out 1.5s infinite}
svg.car.go .road{animation:road .3s linear infinite}
svg.car.idle .whole{animation:idle 1.1s ease-in-out infinite}

svg.sil path,svg.sil circle,svg.sil line,svg.sil rect{fill:none;stroke:var(--pink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 10px rgba(255,46,136,.8))}
svg.sil .dim path,svg.sil .dim circle{stroke:var(--line);filter:none}

/* escenario de atardecer */
#scene{position:absolute;inset:0;z-index:-1;overflow:hidden;border-radius:18px}
#scene svg{width:100%;height:100%}

/* animaciones */
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-1.2deg)}
  50%{transform:translate(2px,-1px) rotate(1.2deg)}75%{transform:translate(-1px,-1px) rotate(-.6deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 18px rgba(255,46,136,.45);transform:scale(1)}50%{box-shadow:0 0 34px rgba(255,46,136,.9);transform:scale(1.03)}}
@keyframes road{to{stroke-dashoffset:-44}}
@keyframes lurch{0%{transform:translateX(0)}16%{transform:translateX(-24px)}58%{transform:translateX(32px)}100%{transform:translateX(0)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.5)}30%{opacity:.6}100%{opacity:0;transform:translate(14px,-46px) scale(1.9)}}
svg.car .pc.st-fix .smoke{animation:puff 2.6s ease-out infinite}
svg.car .pc.st-fix .smoke:nth-child(2){animation-delay:.9s}
svg.car .pc.st-fix .smoke:nth-child(3){animation-delay:1.7s}

/* pantallazo de ronda completada */
#flash{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(17,7,36,.93);text-align:center;padding:30px}
#flash.on{display:grid}
#flash .t{font-family:var(--title);font-size:min(13vw,150px);line-height:.95;
  background:linear-gradient(92deg,var(--gold),var(--orange) 40%,var(--pink) 70%,var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#flash .s{font-family:var(--script);font-size:min(6vw,52px);color:var(--cyan);text-shadow:0 0 20px rgba(46,230,214,.8)}

/* créditos finales */
#credits{position:fixed;inset:0;z-index:70;display:none;overflow:hidden;
  background:radial-gradient(900px 500px at 50% 120%,#3D1466 0%,#110724 70%)}
#credits.on{display:block}
#credits.quieto{overflow:auto}
#roll{position:absolute;left:50%;top:100%;transform:translateX(-50%);width:min(820px,92vw);
  text-align:center;padding-bottom:40vh}
#credits.quieto #roll{position:static;top:auto;transform:none;margin:0 auto;padding:40px 0}
#roll.rodando{animation:roll var(--dur,30s) linear forwards}
@keyframes roll{from{transform:translate(-50%,0)}to{transform:translate(-50%,calc(-1 * var(--dist,2000px)))}}
#roll h1{font-family:var(--title);font-size:min(9vw,74px);line-height:1;margin:0 0 6px;
  background:linear-gradient(92deg,var(--gold),var(--orange) 40%,var(--pink) 70%,var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#roll .sub{font-family:var(--script);font-size:min(5vw,34px);color:var(--cyan);text-shadow:0 0 16px rgba(46,230,214,.7);margin-bottom:46px}
#roll .bloque{margin:0 0 42px}
#roll .rot{font-family:var(--title);font-size:17px;letter-spacing:3px;color:var(--gold);margin-bottom:10px}
#roll .nom{font-size:26px;font-weight:800;line-height:1.35}
#roll .nom small{display:block;font-size:16px;font-weight:400;color:var(--ink2)}
#roll .chiste{color:var(--ink2);font-size:17px;font-style:italic;margin:6px 0;line-height:1.6}
#roll .fin{font-family:var(--title);font-size:min(16vw,140px);line-height:.9;color:var(--pink);
  text-shadow:0 0 36px rgba(255,46,136,.8);margin:56px 0 18px}
#roll .mensaje{font-size:23px;line-height:1.5;max-width:30em;margin:0 auto 60px;color:var(--ink)}
#roll .mensaje b{color:var(--gold)}
#skip{position:fixed;top:16px;right:18px;z-index:71;background:var(--panel);border:1px solid var(--line);
  color:var(--ink2);border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;letter-spacing:1px}
#skip:hover{border-color:var(--purple);color:var(--ink)}
@media (prefers-reduced-motion:reduce){#roll{position:static;transform:none;margin:0 auto;padding:40px 0}
  #credits.on{overflow:auto}}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--purple);

// Si el grupo propone su propio vehiculo, se usan estas.

};
const ORDER = ["col", "res", "amb", "org", "apr", "comp", "conf", "com"];
const REGLAS = [
  "Hablamos de situaciones, no de personas.",
  "Lo que se dice aquí, se queda aquí.",
  "Todas las voces cuentan.",
  "Escuchamos para entender.",
  "Problema + propuesta.",
  "Presencia total: sin pantallas.",
];
const RONDAS = [
  { id: "lobby",       corto: "Entrada",     min: 5,  titulo: "ENTRA AL TALLER",        sub: "Escanea y toma tu lugar" },
  { id: "escaner",     corto: "Escáner",     min: 10, titulo: "¿QUÉ VEHÍCULO SOMOS?",   sub: "Ronda 1 · identificación" },
  { id: "diagnostico", corto: "Averías",     min: 12, titulo: "¿QUÉ PIEZAS FALLAN?",    sub: "Ronda 3 · diagnóstico" },
  { id: "taller",      corto: "Taller",      min: 25, titulo: "MANOS A LA OBRA",        sub: "Ronda 4 · armamos las piezas" },
  { id: "arranque",    corto: "Arranque",    min: 0,  titulo: "¡EL EQUIPO ARRANCA!",    sub: "Cierre" },
];
const idxOf = (p) => Math.max(0, RONDAS.findIndex((r) => r.id === p));
const ronda = () => RONDAS[idxOf(S.phase)];

/* ---------------- sonido (sin archivos, todo sintetizado) ---------------- */
let AC = null, muted = false;
try { muted = localStorage.getItem("tn-mute") === "1"; } catch (e) {}
function ac() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f1, f2, dur, type, vol) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(f1, a.currentTime);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), a.currentTime + dur);
  g.gain.setValueAtTime(0, a.currentTime);
  g.gain.linearRampToValueAtTime(vol == null ? 0.18 : vol, a.currentTime + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur + 0.03);
}
function noise(dur, freq, vol) {
  const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq || 900;
  const g = a.createGain(); g.gain.value = vol == null ? 0.2 : vol;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function sfx(kind) {
  if (muted) return;
  try {
    if (kind === "voto") tone(620, 900, 0.1, "sine", 0.12);
    else if (kind === "clank") { noise(0.22, 1600, 0.25); tone(180, 70, 0.3, "triangle", 0.12); }
    else if (kind === "instalar") { [0, 70, 140].forEach((d, i) => setTimeout(() => tone(500 + i * 180, null, 0.07, "square", 0.1), d)); }
    else if (kind === "tornillo") tone(1250, 1700, 0.12, "triangle", 0.13);
    else if (kind === "ronda") { [0, 110].forEach((d, i) => setTimeout(() => tone(440 + i * 220, null, 0.16, "sawtooth", 0.1), d)); }
    else if (kind === "aplausos") {
      for (let i = 0; i < 90; i++) setTimeout(() => noise(0.055 + Math.random() * 0.05, 1200 + Math.random() * 2600, 0.055 + Math.random() * 0.05), Math.random() * 3400);
    }
    else if (kind === "fin") { [0, 150, 300, 480, 760].forEach((d, i) => setTimeout(() => tone([392, 494, 587, 784, 988][i], null, i === 4 ? 1.1 : 0.26, "triangle", 0.11), d)); }
    else if (kind === "motor") {
      tone(55, 130, 1.5, "sawtooth", 0.17); noise(0.5, 400, 0.12);
      setTimeout(() => [0, 120, 240, 400].forEach((d, i) => setTimeout(() => tone(330 * (1 + i * 0.26), null, 0.22, "square", 0.1), d)), 900);
    }
  } catch (e) {}
}
function paintSound() { $("#bSound").textContent = muted ? "🔇" : "🔊"; $("#bSound").classList.toggle("on", !muted); }
$("#bSound").onclick = () => { muted = !muted; try { localStorage.setItem("tn-mute", muted ? "1" : "0"); } catch (e) {} paintSound(); if (!muted) sfx("voto"); };
paintSound();

/* ---------------- estado ---------------- */
let LIVE = false;          // ¿hay servidor?
let admin = "";            // clave del facilitador
let puedoMandar = false;   // ¿es esta la computadora que está presentando?
let S = null;              // estado público (igual en vivo y sin servidor)
let prev = null;           // estado anterior, para detectar cambios y animar
let lastPiece = null;      // última pieza que cambió, para el "pop"
let drafts = {};           // lo que el facilitador está escribiendo ahora mismo

function freshLocal() {
  return {
    phase: "lobby", joinUrl: location.origin + "/votar", vehiclesDef: VEH.slice(), piecesDef: PZ.slice(),
    pieceOrder: ORDER, custom: [], vehicles: {}, pieces: {}, winner: null, top: [], topFrozen: false,
    votersVehiculo: 0, votersPiezas: 0, phones: 0, ideas: [], installed: {}, nombres: [],
    limites: { idea: 140, ideasPorPersona: 3 }, seq: 0, solo: true,
  };
}
function recalcLocal() {
  S.winner = null; let best = -1;
  for (const v of S.vehiclesDef) { const n = S.vehicles[v.id] || 0; if (n > best) { best = n; S.winner = n > 0 ? v.id : null; } }
  if (!S.topFrozen) {
    S.top = S.piecesDef.map((p) => p.id).filter((id) => (S.pieces[id] || 0) > 0)
      .sort((a, b) => (S.pieces[b] || 0) - (S.pieces[a] || 0) || ORDER.indexOf(a) - ORDER.indexOf(b)).slice(0, 2);
  }
  // cada vehículo le da su propio sentido a las mismas 8 piezas
  const sent = SENTIDOS[S.winner] || {};
  const nom = NOMBRES[S.winner] || {};
  const fall = FALLAS[S.winner] || {};
  const vd = (S.vehiclesDef || VEH).find((v) => v.id === S.winner);
  const hay = (vd && vd.piezas) || PZ.map((p) => p.id);
  S.piecesDef = PZ.filter((p) => hay.includes(p.id)).map((p) => ({ ...p, name: nom[p.id] || p.name, mean: sent[p.id] || p.mean, falla: fall[p.id] || FALLA_BASE[p.id] || "" }));
  S.piezasFaltan = PZ.filter((p) => !hay.includes(p.id)).map((p) => p.name);
  S.faltanNota = (vd && vd.faltan) || "";
  S.votersVehiculo = Object.values(S.vehicles).reduce((a, b) => a + b, 0);
  S.votersPiezas = Math.ceil(Object.values(S.pieces).reduce((a, b) => a + b, 0) / 3);
  saveLocal();
}
function saveLocal() { if (!LIVE) { try { localStorage.setItem("tn-solo", JSON.stringify(S)); } catch (e) {} } }

/* ---------------- enviar acciones (en vivo o local) ---------------- */
async function post(path, data) {
  if (LIVE) {
    const h = { "Content-Type": "application/json" };
    if (path.startsWith("/api/admin/") && !puedoMandar) {
      throw new Error("Solo la computadora que presenta puede mover el taller.");
    }
    if (path.startsWith("/api/admin/")) h["x-admin"] = admin;
    const r = await fetch(path, { method: "POST", headers: h, body: JSON.stringify(data || {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "No se pudo guardar.");
    return j;
  }
  localAction(path.replace("/api/admin/", ""), data || {});
  recalcLocal(); render();
  return { ok: true };
}
function localAction(a, b) {
  const nid = () => Math.random().toString(36).slice(2, 10);
  if (a === "phase") { S.phase = b.phase; if (b.phase === "taller" && !S.topFrozen) { S.topFrozen = true; } }
  else if (a === "custom") { S.custom.push({ id: "c" + nid(), name: b.name }); S.vehiclesDef.push({ id: S.custom[S.custom.length - 1].id, name: b.name, good: "Propuesta del equipo", bad: "" }); }
  else if (a === "adjust") {
    const map = b.kind === "pieza" ? S.pieces : S.vehicles;
    map[b.id] = Math.max(0, (map[b.id] || 0) + (Number(b.d) > 0 ? 1 : -1));
    if (!map[b.id]) delete map[b.id];
  }
  else if (a === "retop") { S.topFrozen = false; recalcLocal(); S.topFrozen = true; for (const k of Object.keys(S.installed)) if (!S.top.includes(k)) delete S.installed[k]; }
  else if (a === "idea") S.ideas.push({ id: nid(), piece: b.piece, text: b.text, favs: 0 });
  else if (a === "idea-delete") { const i = S.ideas.find((x) => x.id === b.id); S.ideas = S.ideas.filter((x) => x.id !== b.id); if (i && S.installed[i.piece] === b.id) delete S.installed[i.piece]; }
  else if (a === "idea-fav") { const i = S.ideas.find((x) => x.id === b.id); if (i) i.favs = (i.favs || 0) + 1; }
  else if (a === "install") {
    if (!b.idea) delete S.installed[b.piece];
    else { S.installed[b.piece] = b.idea; }
  }
  else if (a === "nombre") { S.nombres = (S.nombres || []).concat({ id: nid(), name: b.name }); }
  else if (a === "nombre-delete") { S.nombres = (S.nombres || []).filter((n) => n.id !== b.id); }
  else if (a === "reset") S = freshLocal();
}

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2600); }

/* ---------------- cronómetro por ronda ---------------- */
let timers = {}, tick = null;
RONDAS.forEach((r) => { timers[r.id] = r.min * 60; });
try { const t = JSON.parse(localStorage.getItem("tn-timers") || "null"); if (t) Object.assign(timers, t); } catch (e) {}
function drawClock() {
  const left = timers[S ? S.phase : "lobby"] || 0;
  const c = $("#clock");
  c.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
  c.classList.toggle("low", left > 0 && left <= 60);
  c.classList.toggle("zero", left === 0);
  $("#bTimer").textContent = tick ? "❚❚" : "▶";
  try { localStorage.setItem("tn-timers", JSON.stringify(timers)); } catch (e) {}
}
function toggleTimer() {
  if (tick) { clearInterval(tick); tick = null; drawClock(); return; }
  if (!timers[S.phase]) return;
  tick = setInterval(() => {
    timers[S.phase]--;
    if (timers[S.phase] <= 0) { timers[S.phase] = 0; clearInterval(tick); tick = null; sfx("clank"); }
    drawClock();
  }, 1000);
  drawClock();
}
$("#bTimer").onclick = toggleTimer;
$("#bTreset").onclick = () => { if (tick) { clearInterval(tick); tick = null; } timers[S.phase] = ronda().min * 60; drawClock(); };

// ART.auto queda como chasis genérico para un vehículo que proponga el grupo.

// El vehículo ganador manda. Si el grupo propuso uno suyo, o si por lo que sea
// el dibujo está incompleto, se usa el chasis genérico antes que romper la pantalla.
function art() {
  const a = ART[S.winner];
  return a && a.spot && a.parts && a.lbl ? a : ART.auto;
}

function pieceState(id) {
  const ph = S.phase, n = S.pieces[id] || 0, top = S.top || [];
  if (ph === "lobby" || ph === "escaner") return "ghost";
  if (ph === "diagnostico") return top.includes(id) ? "fix" : n > 0 ? "meh" : "ok";
  if (!top.includes(id)) return n > 0 ? "meh" : "ok";
  if (!S.installed[id]) return "hole";
  return ph === "arranque" ? "bolted" : "fixed";   // al final, la pieza queda apretada
}
function carSVG() {
  const ph = S.phase, A = art();
  // este vehículo puede no traer las 8: lo que no tiene, no se dibuja
  const hay = ORDER.filter((id) => (S.piecesDef || PZ).some((p) => p.id === id) && A.spot[id] && A.lbl[id]);
  const pzs = hay.map((id) => {
    const st = pieceState(id);
    const p = (S.piecesDef || PZ).find((x) => x.id === id) || { name: id, mean: "" };
    const [sx, sy] = A.spot[id];
    const smoke = st === "fix" ? [0, 1, 2].map((i) => `<circle class="smoke" cx="${sx + i * 5 - 5}" cy="${sy - 14}" r="${7 + i * 2}"/>`).join("") : "";
    const hole = st === "hole" ? `<circle class="hole" cx="${sx}" cy="${sy}" r="26"/>` : "";
    return `<g class="pc st-${st} ${lastPiece === id ? "pop" : ""}" data-p="${id}"><title>${esc(p.name)}: ${esc(p.mean)}</title>${A.parts[id]}${smoke}</g>${hole}`;
  }).join("");
  const lbls = hay.map((id) => {
    const st = pieceState(id), [x, y] = A.lbl[id], n = S.pieces[id] || 0;
    const p = (S.piecesDef || PZ).find((x2) => x2.id === id) || { name: id };

    return `<g class="lbl st-${st}"><rect x="${x - w / 2}" y="${y - 15}" width="${w}" height="30" rx="15"/><text x="${x}" y="${y + 5}" text-anchor="middle">${esc(txt)}</text></g>`;
  }).join("");
  const cls = ph === "arranque" ? "go on " : "";
  const nombre = S.winner ? vName(S.winner) : "equipo";
  return `<svg class="car ${cls}" viewBox="0 0 820 430" role="img" aria-label="${esc(nombre)} del equipo con sus ${hay.length} piezas">

    <defs><linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#FFC857" stop-opacity=".75"/><stop offset="1" stop-color="#FFC857" stop-opacity="0"/></linearGradient></defs>
  </svg>`;
}

/* ---------------- resumen en texto ---------------- */
function resumenTexto() {
  const L = [];
  L.push("SCRUM CITY · TUNEANDO EL EQUIPO SOLTI");
  L.push("");
  L.push("HOY SOMOS: " + (S.winner ? vName(S.winner) : "(sin votos)"));
  const vs = Object.entries(S.vehicles).sort((a, b) => b[1] - a[1]);
  if (vs.length) L.push("  votos: " + vs.map(([k, n]) => vName(k) + " " + n).join(", "));
  L.push("");
  L.push("PIEZAS QUE HAY QUE ARREGLAR:");
  for (const pid of (S.top || [])) {
    const idea = (S.ideas || []).find((i) => i.id === S.installed[pid]);
    L.push("- " + pName(pid) + " (" + (S.pieces[pid] || 0) + " votos) · " + pMean(pid));
    L.push("    idea que ganó: " + (idea ? idea.text : "—"));
    const otras = (S.ideas || []).filter((i) => i.piece === pid && S.installed[pid] !== i.id);
    if (otras.length) L.push("    otras ideas:   " + otras.map((i) => i.text).join(" | "));
  }
  if ((S.nombres || []).length) { L.push(""); L.push("EN LA SALA: " + S.nombres.map((n) => n.name).join(", ")); }
  L.push("");
  L.push("REVISIONES: 30 días revisar · 60 días ajustar · 90 días volver a votar");
  L.push("");
  L.push("Esto es un diagnóstico, no un plan. Lo que lo convierte en plan es lo que pase el lunes.");
  return L.join("\n");
}
async function copy(txt, msg) {
  try { await navigator.clipboard.writeText(txt); toast(msg); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(msg); } catch (e2) { toast("No se pudo copiar."); }
    ta.remove();
  }
}

  // contadores
  const cp = $("#cPhones"), cv = $("#cVotes");
  cp.hidden = !LIVE; cp.querySelector("b").textContent = S.phones || 0;
  const votos = S.phase === "diagnostico" ? Object.values(S.pieces).reduce((a, b) => a + b, 0) : Object.values(S.vehicles).reduce((a, b) => a + b, 0);
  cv.hidden = !(S.phase === "escaner" || S.phase === "diagnostico"); cv.querySelector("b").textContent = votos;

  // vehículo
  const box = $("#carbox");
  if (S.phase === "escaner") {
    box.innerHTML = `<div id="scene">${scene()}</div>` + (S.winner ? silSVG(S.winner) : silSVG("none"));
  } else {
    box.innerHTML = `<div id="scene">${scene()}</div>` + carSVG();
  }

  // placa
  const pl = $("#placa");
  if (S.phase === "lobby") pl.innerHTML = `<span class="q">VEHÍCULO SIN IDENTIFICAR</span>`;
  else if (S.phase === "escaner") pl.innerHTML = S.winner ? `<span class="q">ESCANEANDO…</span><span class="box">${esc(vName(S.winner))}</span>` : `<span class="q">ESCANEANDO…</span>`;
  else pl.innerHTML = (S.winner ? `<span class="mini">${silSVG(S.winner)}</span>` : "") +
    `<span class="q">HOY SOMOS UN</span><span class="box">${esc(S.winner ? vName(S.winner) : "¿?")}</span>`;

  // pie del vehículo
  const foot = $("#bayfoot");
  if (S.phase === "diagnostico") foot.textContent = "Rojo: hay que arreglarla · Dorado: algunos votos · Cian: funciona bien";
  else if (S.phase === "taller") foot.textContent = "Los huecos rojos son las piezas desmontadas. Se llenan al instalar una idea.";
  else if (S.phase === "arranque") foot.textContent = "Las piezas, de vuelta en su sitio.";
  else if (S.phase === "escaner") foot.textContent = "La silueta cambia según va ganando un vehículo.";
  else foot.textContent = "";
  // Si en este vehículo alguna pieza toma otra forma, se aclara aquí.
  if (S.phase !== "lobby" && S.phase !== "escaner" && art().nota) {
    foot.textContent = (foot.textContent ? foot.textContent + "  ·  " : "") + art().nota;
  }

  // panel de la ronda
  const panel = $("#panel");
  const act = document.activeElement, actId = act && act.id, ss = act && act.selectionStart, se = act && act.selectionEnd;
  panel.innerHTML = (PANELS[S.phase] || panelLobby)();
  if (actId) { const n = document.getElementById(actId); if (n) { n.focus(); try { n.setSelectionRange(ss, se); } catch (e) {} } }

  // banca
  const top = S.top || [];
  $("#bolts").innerHTML = top.length
    ? top.map((pid) => `<div class="bolt ${S.installed[pid] ? "on" : ""}" title="${esc(pName(pid))}">${S.installed[pid] ? "✓" : "○"}</div>`).join("")
    : "";
  $("#hint").innerHTML = hintFor(r);
  const last = idxOf(S.phase) === RONDAS.length - 1;
  $("#bNext").textContent = last ? "↺ EMPEZAR DE NUEVO" : NEXTLBL[S.phase] || "SIGUIENTE ▶";
  $("#bNext").classList.toggle("pulse", S.phase === "taller" && top.length > 0 && installCount() === top.length);
  $("#bPrev").disabled = idxOf(S.phase) === 0;
  const puede = !LIVE || (!!admin && puedoMandar);
  $("#bNext").disabled = !puede; $("#bPrev").disabled = $("#bPrev").disabled || !puede;
  document.body.classList.toggle("lectura", LIVE && !puede);

  if (S.phase !== "arranque") creditosOn = false;        // listo para el próximo cierre
  drawClock();
}
const NEXTLBL = {
  lobby: "ABRIR EL ESCÁNER ▶", escaner: "CERRAR Y DIAGNOSTICAR ▶", diagnostico: "DESMONTAR LAS PIEZAS ▶",
  taller: "¡ARRANCAR! ▶",
};
function hintFor(r) {
  if (LIVE && !puedoMandar) return `Modo lectura. El taller solo se mueve desde la computadora que lo está presentando.`;
  if (LIVE && !admin) return `Pantalla en modo lectura. Abre el enlace con <b>?admin=…</b> que salió en la consola para poder mover las rondas.`;
  const top = S.top || [];
  if (S.phase === "lobby") return `Espera a que todos escaneen el QR. Luego abre el escáner.`;
  if (S.phase === "escaner") return `Cada celular elige un vehículo. Puedes agregar los que proponga el grupo.`;
  if (S.phase === "diagnostico") return `Cada quien marca hasta 2 frases que reconozca en nosotros. Las 2 más votadas se desmontan.`;
  if (S.phase === "taller") return `Instaladas ${installCount()} de ${top.length}. Instala la idea más apoyada de cada pieza.`;
  return `Copia el resumen y mándalo al equipo. Revisión a los 30 días.`;
}

/* ---------------- créditos finales ---------------- */
const ROL = {
  comp: "DIRECCIÓN DE MOTOR", conf: "JEFE DE COMBUSTIBLE", org: "DIRECCIÓN GENERAL",
  com: "SONIDO Y COMUNICACIONES", col: "COORDINACIÓN DE MOVIMIENTO", res: "ESPECIALISTA EN FRENADAS",
  apr: "GUION Y DOCUMENTACIÓN", amb: "AMBIENTACIÓN Y VESTUARIO",
};
const MENSAJE_FINAL = `Hoy no arreglamos el vehículo.<br><br>
  Hoy hicimos algo más difícil: <b>ponernos de acuerdo en qué está sonando raro</b>.<br><br>
  Lo demás se arregla el lunes, cuando alguien toque la primera pieza.<br><br>
  Nos vemos en 30 días, a ver si prende.`;

function rodarCreditos() {
  const ord = S.top || [], roll = $("#roll"), cr = $("#credits");
  const reparto = ord.map((pid) => {
    const idea = (S.ideas || []).find((i) => i.id === S.installed[pid]);
    return `<div class="nom">${esc(ROL[pid] || pName(pid))}<small>${esc(idea ? idea.text : "pieza aún desmontada")}</small></div>`;
  }).join("");
  const primeraIdea = ord.length ? (S.ideas || []).find((i) => i.id === S.installed[ord[0]]) : null;
  const nIdeas = (S.ideas || []).length;
  const votos = Object.values(S.vehicles || {}).reduce((a, b) => a + b, 0);

  roll.innerHTML = `
    <h1>SCRUM CITY</h1>
    <div class="sub">tuneando el equipo SOLTI</div>
    <div class="bloque"><div class="rot">REPARTO</div>
      ${(S.nombres || []).length
        ? `<div class="nom" style="font-size:22px;line-height:1.9">${(S.nombres || []).map((n) => esc(n.name)).join(" · ")}</div>
           <small style="color:var(--ink2);font-size:16px">y sus ${votos} votos, que siguen siendo secretos</small>`
        : `<div class="nom">${votos} mecánicos<small>que votaron sin decir su nombre</small></div>`}</div>
    <div class="bloque"><div class="rot">EQUIPO TÉCNICO</div>${reparto || `<div class="nom">—</div>`}</div>
    <div class="bloque"><div class="rot">EFECTOS ESPECIALES</div>
      <div class="nom">${nIdeas} ${nIdeas === 1 ? "idea" : "ideas"}<small>salidas de los celulares de esta sala</small></div></div>
    <div class="bloque"><div class="rot">PRIMERA ESCENA DE LA SECUELA</div>
      <div class="nom">${esc(primeraIdea ? primeraIdea.text : "lo que hagamos el lunes")}<small>en 30 días sabremos si pasó</small></div></div>
    <div class="bloque">
      <p class="chiste">Ningún Motor fue maltratado durante este taller.</p>
      <p class="chiste">Cualquier parecido con la realidad es exactamente el punto.</p>
      <p class="chiste">Las opiniones son 100% anónimas y 0% culpa de quien las escribió.</p>
      <p class="chiste">Los Frenos siguen en revisión.</p>
    </div>
    <div class="bloque"><div class="rot">PRÓXIMAMENTE</div>
      <div class="nom">“EL REGRESO DEL EQUIPO”<small>en 30 días, en esta misma sala</small></div></div>
    <div class="bloque"><div class="rot">Y UN APLAUSO PARA</div>
      <div class="nom" style="font-size:38px">EL EQUIPO SOLTI</div></div>
    <div class="fin">FIN</div>
    <div class="mensaje">${MENSAJE_FINAL}</div>`;

  cr.classList.add("on");
  cr.setAttribute("aria-hidden", "false");
  sfx("fin");
  setTimeout(() => sfx("aplausos"), 1200);

  const lento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (lento) { cr.classList.add("quieto"); return; }
  const alto = roll.scrollHeight;
  const dist = alto + window.innerHeight * 0.1;
  const dur = Math.min(40, Math.max(24, Math.round(alto / 70)));   // ~30 s, igual que en los celulares
  roll.style.setProperty("--dist", dist + "px");
  roll.style.setProperty("--dur", dur + "s");
  roll.classList.remove("rodando");
  void roll.offsetWidth;            // reinicia la animación si se vuelve a rodar
  roll.classList.add("rodando");
}
// Al entrar al cierre, los créditos ruedan solos (una sola vez por cierre).
let creditosOn = false;
function programarCreditos(ms) {
  if (creditosOn) return;
  creditosOn = true;
  setTimeout(() => { if (S && S.phase === "arranque") rodarCreditos(); }, ms || 2200);
}
function cerrarCreditos() {
  const cr = $("#credits");
  cr.classList.remove("on", "quieto");
  cr.setAttribute("aria-hidden", "true");
  $("#roll").classList.remove("rodando");
}
$("#skip").onclick = cerrarCreditos;
$("#credits").onclick = (e) => { if (e.target.id === "credits") cerrarCreditos(); };

/* ---------------- pantallazo entre rondas ---------------- */
function flash(t, s, after, ms) {
  const f = $("#flash");
  $("#flashT").textContent = t; $("#flashS").textContent = s || "";
  f.classList.add("on");
  setTimeout(() => { f.classList.remove("on"); if (after) after(); }, ms || 1700);
}

/* ---------------- avanzar y retroceder ---------------- */
function nextRound() {
  const i = idxOf(S.phase);
  if (i === RONDAS.length - 1) {
    if (confirm("¿Empezar un taller nuevo? Se borran los votos, las ideas y los nombres.")) go("/api/admin/reset");
    return;
  }
  const next = RONDAS[i + 1];
  const titulos = {
    escaner: ["¡ESCÁNER LISTO!", "a ver qué somos"],
    diagnostico: ["¡DIAGNÓSTICO!", "qué piezas fallan"],
    taller: ["¡PIEZAS FUERA!", "hay que armarlas"],
    arranque: ["¡APLAUSOS!", "para el equipo SOLTI"],
  };
  const t = titulos[next.id] || [next.titulo, next.sub];
  if (next.id === "arranque") programarCreditos(4200);   // después del pantallazo de aplausos
  if (next.id === "taller") sfx("clank");
  else if (next.id === "arranque") { sfx("motor"); setTimeout(() => sfx("aplausos"), 1100); }
  else sfx("ronda");
  flash(t[0], t[1], () => go("/api/admin/phase", { phase: next.id }), next.id === "arranque" ? 3600 : 1700);
}
$("#bNext").onclick = nextRound;
$("#bPrev").onclick = () => { const i = idxOf(S.phase); if (i > 0) go("/api/admin/phase", { phase: RONDAS[i - 1].id }); };

/* ---------------- menú del facilitador ---------------- */
$("#bMenu").onclick = () => {
  const op = prompt(
    "MENÚ DEL FACILITADOR\n\n" +
    "1 · Ir a una ronda (1-7)\n" +
    "2 · Recalcular las piezas averiadas\n" +
    "3 · Copiar el resumen en texto\n" +
    "4 · Copiar los datos (JSON)\n" +
    "5 · Empezar un taller nuevo\n\n" +
    "Escribe el número:", "");
  if (!op) return;
  if (op.trim() === "1") {
    const n = prompt("Ronda:\n" + RONDAS.map((r, i) => (i + 1) + " · " + r.corto).join("\n"), String(idxOf(S.phase) + 1));
    const i = Number(n) - 1; if (RONDAS[i]) go("/api/admin/phase", { phase: RONDAS[i].id });
  } else if (op.trim() === "2") { if (confirm("¿Recalcular las 2 piezas averiadas con los votos actuales?")) go("/api/admin/retop"); }
  else if (op.trim() === "3") copy(resumenTexto(), "Resumen copiado.");
  else if (op.trim() === "4") copy(JSON.stringify(S, null, 2), "Datos copiados.");
  else if (op.trim() === "5") { if (confirm("¿Empezar un taller nuevo? Se borra todo.")) go("/api/admin/reset"); }
};

/* ---------------- eventos del panel ---------------- */
let acTimer = {};
$("#panel").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.adj) { const [kind, id, d] = b.dataset.adj.split(":"); lastPiece = kind === "pieza" ? id : null; sfx("voto"); go("/api/admin/adjust", { kind, id, d: Number(d) }); return; }
  if (b.id === "addveh") { const i = $("#newveh"); const name = i.value.trim(); if (name) { go("/api/admin/custom", { name }); i.value = ""; } return; }
  if (b.dataset.addidea) { const i = $("#idea-" + b.dataset.addidea); const text = i.value.trim(); if (text) { go("/api/admin/idea", { piece: b.dataset.addidea, text }); i.value = ""; } return; }
  if (b.dataset.del) { go("/api/admin/idea-delete", { id: b.dataset.del }); return; }
  if (b.dataset.install) {
    const [piece, idea] = b.dataset.install.split(":");
    if (idea) sfx("instalar");
    lastPiece = piece;
    go("/api/admin/install", { piece, idea: idea || null });
    return;
  }
  if (b.id === "addquien") { const i = $("#quien"); const name = i.value.trim(); if (name) { go("/api/admin/nombre", { name }); i.value = ""; } return; }
  if (b.dataset.quita) { go("/api/admin/nombre-delete", { id: b.dataset.quita }); return; }
  if (b.id === "rodar") { rodarCreditos(); return; }
  if (b.id === "aplauso") { sfx("aplausos"); flash("¡APLAUSOS!", "para el equipo SOLTI", null, 3600); return; }
  if (b.id === "copyTxt") { copy(resumenTexto(), "Resumen copiado."); return; }
  if (b.id === "copyJson") { copy(JSON.stringify(S, null, 2), "Datos copiados."); return; }
  if (b.id === "loadJson") {
    const txt = prompt("Pega aquí los datos que copiaste:");
    if (!txt) return;
    try {
      const d = JSON.parse(txt);
      if (LIVE) { toast("Con servidor, carga los datos reemplazando partida.json."); return; }
      S = Object.assign(freshLocal(), d); recalcLocal(); render(); toast("Datos cargados.");
    } catch (e) { toast("Esos datos no se entienden."); }
  }
});
$("#panel").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const t = e.target;
  if (t.id === "newveh") { $("#addveh").click(); }
  else if (t.id && t.id.startsWith("idea-")) { const b = $('[data-addidea="' + t.id.slice(5) + '"]'); if (b) b.click(); }
  else if (t.id === "quien") { $("#addquien").click(); }
});
/* ---------------- teclado ---------------- */
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight") { e.preventDefault(); $("#bNext").click(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); if (!$("#bPrev").disabled) $("#bPrev").click(); }
  else if (e.key === " ") { e.preventDefault(); toggleTimer(); }
});

/* ---------------- detectar cambios para animar y sonar ---------------- */
function reactTo(next) {
  if (!prev) return;
  const vA = Object.values(prev.vehicles || {}).reduce((a, b) => a + b, 0);
  const vB = Object.values(next.vehicles || {}).reduce((a, b) => a + b, 0);
  const pA = Object.values(prev.pieces || {}).reduce((a, b) => a + b, 0);
  const pB = Object.values(next.pieces || {}).reduce((a, b) => a + b, 0);
  if (prev.phase !== "arranque" && next.phase === "arranque") programarCreditos();
  if (vB > vA || pB > pA) sfx("voto");
  if ((next.ideas || []).length > (prev.ideas || []).length) sfx("voto");
  // qué pieza cambió, para el "pop"
  lastPiece = null;
  for (const id of ORDER) if ((next.pieces[id] || 0) !== (prev.pieces[id] || 0)) lastPiece = id;
  if (Object.keys(next.installed || {}).length > Object.keys(prev.installed || {}).length) {
    for (const k of Object.keys(next.installed)) if (!prev.installed[k]) lastPiece = k;
  }
}

/* ---------------- arranque ---------------- */
function readAdmin() {
  const u = new URL(location.href);
  const k = u.searchParams.get("admin");
  if (k) {
    try { sessionStorage.setItem("tn-admin", k); } catch (e) {}
    u.searchParams.delete("admin");
    history.replaceState(null, "", u.pathname + (u.search || "") + u.hash);
  }
  try { admin = sessionStorage.getItem("tn-admin") || k || ""; } catch (e) { admin = k || ""; }
}

function connect() {
  const es = new EventSource("/api/stream");
  es.onmessage = (ev) => {
    const next = JSON.parse(ev.data);
    LIVE = true;
    reactTo(next);
    prev = S; S = next;
    render();
  };
  es.onerror = () => { /* el navegador reintenta solo */ };
}

async function boot() {
  readAdmin();
  // El servidor dice si esta pantalla es la que presenta. Si no lo es, se ve todo
  // pero no se toca nada, por mucho que alguien copie el enlace con la clave.
  try {
    const a = await fetch("/api/acceso", { cache: "no-store" });
    if (a.ok) puedoMandar = !!(await a.json()).puedeMandar;
  } catch (e) { puedoMandar = false; }
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error("no");
    S = await r.json(); LIVE = true;
    render();
    connect();
  } catch (e) {
    LIVE = false;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem("tn-solo") || "null"); } catch (e2) {}
    S = saved ? Object.assign(freshLocal(), saved) : freshLocal();
    S.joinUrl = location.origin + "/votar";
    recalcLocal();
    render();
    toast("Sin servidor: el taller funciona solo, los votos se ponen a mano.");
  }
}
boot();
</script>
</body>
</html>
